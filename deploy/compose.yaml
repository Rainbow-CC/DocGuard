services:
  docguard:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: docguard:demo
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      openclaw:
        condition: service_healthy
    ports:
      # Keep the unauthenticated demo service reachable only from this server by default.
      # Change DOCGUARD_BIND_ADDRESS to 0.0.0.0 only behind a reverse proxy or a trusted LAN.
      - "${DOCGUARD_BIND_ADDRESS:-127.0.0.1}:${DOCGUARD_PORT:-8000}:8000"
    volumes:
      # SQLite, uploads, task artifacts, and logs survive image/container replacement.
      - ./runtime:/var/lib/docguard
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/healthz').read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  openclaw:
    image: docguard-openclaw:2026.6.10
    restart: unless-stopped
    environment:
      HOME: /home/ubuntu
      OPENCLAW_STATE_DIR: ${OPENCLAW_HOST_HOME}
      OPENCLAW_CONFIG_PATH: ${OPENCLAW_HOST_HOME}/docguard-openclaw.json5
      OPENCLAW_WORKSPACE_DIR: ${OPENCLAW_HOST_HOME}/workspace
      # These paths are also consumed by the included per-agent configuration.
      # Keep their container paths identical to the host paths: the Gateway asks
      # the host Docker daemon to create the sibling audit sandbox.
      OPENCLAW_HOST_HOME: ${OPENCLAW_HOST_HOME}
      DOCGUARD_RUNTIME_HOST: ${DOCGUARD_RUNTIME_HOST}
      OPENCLAW_GATEWAY_BIND: lan
      OPENCLAW_GATEWAY_PORT: "18789"
      # DocGuard authenticates with OPENCLAW_API_TOKEN; the Gateway receives the
      # same value under OpenClaw's server-side token variable.
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_API_TOKEN:-}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
    command: ["node", "openclaw.mjs", "gateway", "--bind", "lan", "--port", "18789"]
    group_add:
      - "${DOCKER_GID}"
      # runtime is 10001:10001 mode 750. The Gateway needs read/traverse access
      # to validate the external bind source, but not write permission.
      - "10001"
    volumes:
      - ${OPENCLAW_HOST_HOME}:${OPENCLAW_HOST_HOME}
      - ${DOCGUARD_RUNTIME_HOST}:${DOCGUARD_RUNTIME_HOST}
      - ${DOCGUARD_REPO_HOST}:${DOCGUARD_REPO_HOST}:ro
      - /var/run/docker.sock:/var/run/docker.sock
    expose:
      - "18789"
    cap_drop:
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - "node -e \"fetch('http://127.0.0.1:18789/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
