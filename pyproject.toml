[project]
name = "docguard"
version = "0.1.0"
description = "Evidence-driven technical document audit service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]>=0.115,<1.0",
  "httpx>=0.28,<1.0",
  "jinja2>=3.1,<4.0",
  "langgraph>=0.4,<2.0",
  "markdown-it-py>=4.0,<5.0",
  "pydantic>=2.10,<3.0",
  "openai>=1.0,<3.0",
  "pillow>=10,<12",
  "python-dotenv>=1.0,<2.0",
  "reportlab>=4.2,<5.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.25,<1.0",
  "ruff>=0.9,<1.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docguard"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: performs a real external model call"]

[tool.ruff]
line-length = 100
target-version = "py312"
